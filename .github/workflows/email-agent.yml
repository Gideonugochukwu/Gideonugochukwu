name: Email Agent

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
      GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secrets are present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: ANTHROPIC_API_KEY secret is empty or not set"
            exit 1
          fi
          if [ -z "$GMAIL_CREDENTIALS" ]; then
            echo "ERROR: GMAIL_CREDENTIALS secret is empty or not set"
            exit 1
          fi
          if [ -z "$GMAIL_TOKEN" ]; then
            echo "ERROR: GMAIL_TOKEN secret is empty or not set"
            exit 1
          fi
          echo "All secrets present."
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"

      - name: Write Gmail credentials from secrets
        run: |
          python3 -c "
          import os, sys
          creds = os.environ.get('GMAIL_CREDENTIALS', '')
          token = os.environ.get('GMAIL_TOKEN', '')
          if not creds:
              print('ERROR: GMAIL_CREDENTIALS is empty'); sys.exit(1)
          if not token:
              print('ERROR: GMAIL_TOKEN is empty'); sys.exit(1)
          open('credentials.json', 'w').write(creds)
          open('token.json', 'w').write(token)
          print('Credentials written successfully.')
          "

      - name: Run email agent
        run: python standalone_runner.py

      - name: Clean up credential files
        if: always()
        run: rm -f credentials.json token.json
